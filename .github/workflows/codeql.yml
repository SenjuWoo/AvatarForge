name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  python:
    name: Python analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: python
          build-mode: none
      - name: Analyze Python
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        env:
          # Load the exact authenticated desktop boundary; retain every default query.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"run-queries":["--search-path=${{ github.workspace }}/.github/codeql/extensions","--model-packs=senjuwoo/avatarforge-desktop-authority"],"interpret-results":["--search-path=${{ github.workspace }}/.github/codeql/extensions","--model-packs=senjuwoo/avatarforge-desktop-authority"]}}
        with:
          category: /language:python
